name = "forgeai"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Output dir dari @cloudflare/next-on-pages
pages_build_output_dir = ".vercel/output/static"

# =============================================================================
# Environment Variables (non-secret)
# Secret variables ditambahkan via: wrangler pages secret put VAR_NAME
# Atau di Cloudflare dashboard > Pages > Settings > Environment variables
# =============================================================================

[vars]
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_SUPABASE_URL = "https://asxcpepirqzwhdxzjyoi.supabase.co"
# NEXT_PUBLIC_SUPABASE_ANON_KEY  -> set via dashboard (atau vars di bawah)
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY -> set via dashboard

# =============================================================================
# Untuk local dev dengan wrangler pages dev, buat file .dev.vars
# (format sama dengan .env tapi tanpa quotes)
# =============================================================================
